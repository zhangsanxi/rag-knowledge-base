<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>我的知识库助手</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, "Segoe UI", sans-serif;
            background: #f5f5f7;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            background: #0071e3;
            color: white;
            padding: 16px;
            text-align: center;
            font-size: 18px;
            font-weight: 600;
        }
        #status {
            background: #e8f5e9;
            padding: 8px 16px;
            font-size: 13px;
            color: #2e7d32;
            border-bottom: 1px solid #c8e6c9;
        }
        #upload-area {
            padding: 10px 16px;
            background: white;
            border-bottom: 1px solid #ddd;
            display: flex;
            gap: 10px;
            align-items: center;
        }
        #upload-area input[type=file] { font-size: 13px; }
        #upload-btn {
            padding: 6px 16px;
            background: #0071e3;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
        }
        #chat {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }
        .msg {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 12px;
            margin: 10px 0;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .user { background: #0071e3; color: white; margin-left: auto; }
        .ai   { background: white; color: #333; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
        .sources {
            font-size: 12px;
            color: #888;
            margin-top: 8px;
            border-top: 1px dashed #ddd;
            padding-top: 6px;
        }
        #input-area {
            display: flex;
            gap: 10px;
            padding: 16px;
            background: white;
            border-top: 1px solid #ddd;
        }
        #question {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }
        #question:focus { border-color: #0071e3; }
        #send-btn {
            padding: 12px 28px;
            background: #0071e3;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
        }
        #send-btn:disabled { background: #aaa; cursor: not-allowed; }
    </style>
</head>
<body>
    <header>📚 我的知识库助手</header>
    <div id="status">加载中...</div>

    <div id="upload-area">
        <input type="file" id="file-input" accept=".md,.txt" />
        <button id="upload-btn">上传到知识库</button>
    </div>

    <div id="chat"></div>

    <div id="input-area">
        <input id="question" placeholder="基于知识库提问..." />
        <button id="send-btn">发送</button>
    </div>

    <script>
        const API = "http://127.0.0.1:8000";
        const chat = document.getElementById("chat");
        const questionInput = document.getElementById("question");
        const sendBtn = document.getElementById("send-btn");
        const fileInput = document.getElementById("file-input");
        const uploadBtn = document.getElementById("upload-btn");
        const statusEl = document.getElementById("status");

        // 刷新知识库状态
        async function refreshStatus() {
            try {
                const res = await fetch(API + "/status");
                const data = await res.json();
                statusEl.textContent = `知识库已收录 ${data.total_chunks} 个片段`;
            } catch (e) {
                statusEl.textContent = "无法连接后端，请确认 uvicorn 正在运行";
            }
        }

        // 添加消息
        function addMsg(text, cls, sources) {
            const div = document.createElement("div");
            div.className = "msg " + cls;
            div.textContent = text;
            if (sources && sources.length) {
                const src = document.createElement("div");
                src.className = "sources";
                src.textContent = "📎 参考了 " + sources.length + " 段原文";
                div.appendChild(src);
            }
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        // 上传
        uploadBtn.onclick = async () => {
            const file = fileInput.files[0];
            if (!file) { alert("请先选文件"); return; }

            uploadBtn.disabled = true;
            uploadBtn.textContent = "上传中...";

            const formData = new FormData();
            formData.append("file", file);

            try {
                const res = await fetch(API + "/upload", {
                    method: "POST",
                    body: formData
                });
                const data = await res.json();
                addMsg(`✅ 已上传《${data.filename}》，切出 ${data.chunks} 块`, "ai");
                refreshStatus();
            } catch (e) {
                addMsg("上传失败：" + e.message, "ai");
            } finally {
                uploadBtn.disabled = false;
                uploadBtn.textContent = "上传到知识库";
                fileInput.value = "";
            }
        };

        // 提问
        async function ask() {
            const q = questionInput.value.trim();
            if (!q) return;

            addMsg(q, "user");
            questionInput.value = "";
            sendBtn.disabled = true;
            sendBtn.textContent = "思考中...";

            try {
                const res = await fetch(API + "/ask", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ question: q })
                });
                const data = await res.json();
                addMsg(data.answer, "ai", data.sources);
            } catch (e) {
                addMsg("出错了：" + e.message, "ai");
            } finally {
                sendBtn.disabled = false;
                sendBtn.textContent = "发送";
            }
        }

        sendBtn.onclick = ask;
        questionInput.addEventListener("keypress", e => {
            if (e.key === "Enter") ask();
        });

        // 页面加载时刷新状态
        refreshStatus();
    </script>
</body>
</html>
